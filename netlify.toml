# Proje kodu alt klasörde bulunduğu için Netlify'ın derlemeyi oradan yapması gerekir.
[build]
  base = "ismet-group-website 2"
  command = "npm install --include=dev && npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  NEXT_TELEMETRY_DISABLED = "1"

[[plugins]]
  package = "@netlify/plugin-nextjs"
